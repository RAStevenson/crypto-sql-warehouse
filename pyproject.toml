[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-sql-warehouse"
version = "0.1.0"
description = "Incremental, idempotent Coinbase OHLCV ingestion into a layered PostgreSQL warehouse"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pyright>=1.1.400"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pyright]
# Type checking in pyright's basic mode. Declared here so an editor (Pylance
# in VS Code reads this section) and the GitHub Actions runner apply the same rules. A
# finding is fixed with explicit code; an ignore comment is used only where a
# library's own typing is wrong, and says so.
include = ["src", "scripts", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
