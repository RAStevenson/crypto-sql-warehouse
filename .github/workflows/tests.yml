name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # This job has no PostgreSQL service. tests/test_against_postgres.py
      # skips itself here because CRYPTO_WAREHOUSE_TEST_DATABASE_URL is unset,
      # and the rest of the suite needs no database and no network. Of the
      # tests that run here, the one that runs dbt only parses the project.
      - run: ruff check src scripts tests
      - run: pyright
      - run: python -m pytest tests -q

  # This job builds and tests the warehouse itself against a real
  # PostgreSQL. It applies the schema, has dbt build the marts, loads a small
  # fixture in place of a call to Coinbase, refreshes the marts, runs every
  # dbt test and the timezone check, and writes both exports. The fixture's
  # 45 days of hourly candles give the marts returns and 30-day columns to
  # fill in, so a mart that breaks a rule on those columns fails here before
  # it reaches a warehouse holding real history. psql loads the fixture's
  # rows directly, so the loader is tested by the last step instead, which
  # runs tests/test_against_postgres.py in a database of its own.
  warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_warehouse
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 17 is installed from PostgreSQL's own package repository
      # rather than pulled as a container image. Docker Hub (2026-10-09) and
      # then Amazon's public mirror of it (2026-10-21) both stopped this job
      # before its first step, because every GitHub runner shares their
      # limits on anonymous downloads. The runner image's own PostgreSQL 16
      # cluster is removed first so version 17 takes the default port.
      - name: Install and start PostgreSQL 17
        run: |
          sudo pg_dropcluster --stop 16 main || true
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
          sudo pg_ctlcluster 17 main start || true
          pg_lsclusters
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          pg_isready -h localhost -p 5432
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create the database, apply the schema, and have dbt build the marts
        run: python scripts/run_setup.py
      - name: Load the fixture in place of a Coinbase backfill
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/fixtures/warehouse_sample.sql
      - name: Refresh the marts from the fixture
        run: python scripts/run_dbt.py run
      - name: Run every dbt test and the timezone check
        run: python scripts/run_verify.py
      - name: Write both exports
        run: |
          python scripts/run_export.py prices --timeframe 15m --output exports/prices.csv
          python scripts/run_export.py daily --output exports/daily.csv
          test "$(wc -l < exports/prices.csv)" -gt 1
          test "$(wc -l < exports/daily.csv)" -gt 1
      - name: Run the loader's SQL and the migrations against PostgreSQL
        env:
          CRYPTO_WAREHOUSE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_warehouse_test
        run: python -m pytest tests/test_against_postgres.py
